<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TEXT TO SPEECH — Voice Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <p class="brand-mark">Pocket TTS</p>
      <h1>Voice Browser</h1>
      <p class="lede">Listen to every built-in voice. Pick one, play the sample, or type your own line.</p>
    </div>
    <div class="status" id="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Starting…</span>
    </div>
  </header>

  <section class="controls">
    <label class="field grow">
      <span>Text to speak</span>
      <textarea id="text" rows="2" placeholder="Leave empty to use each voice’s default sample…"></textarea>
    </label>
    <label class="field">
      <span>Filter</span>
      <select id="langFilter">
        <option value="all">All languages</option>
      </select>
    </label>
  </section>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <p>Powered by <a href="https://github.com/kyutai-labs/pocket-tts" target="_blank" rel="noreferrer">Kyutai Pocket TTS</a>. First play per voice is slower while the voice state loads.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
